<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartelería municipal de Bubión</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F3EF;--panel:#fff;--ink:#1D2A2E;--mute:#586468;--line:#d5dbd6;--red:#B8553A;--blue:#3B7A57;--yel:#D9A93A;--chip:#e8ede8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121C1B;--panel:#1A2827;--ink:#EEF1EA;--mute:#9DAFAA;--line:#2B3D3B;--chip:#233432;--red:#DB6F50;--blue:#6DB48A;--yel:#E4B94F}}
:root[data-theme="dark"]{--bg:#121C1B;--panel:#1A2827;--ink:#EEF1EA;--mute:#9DAFAA;--line:#2B3D3B;--chip:#233432;--red:#DB6F50;--blue:#6DB48A;--yel:#E4B94F}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Archivo,system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}
h1{font:800 clamp(28px,5vw,44px)/1.05 Archivo,system-ui,sans-serif;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 20px}
.grid{display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1.2fr 1fr}.out{position:sticky;top:16px;align-self:start}}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.row h2{font:600 16px Archivo,system-ui,sans-serif;margin:0 0 10px;display:flex;gap:10px;align-items:center}
.n{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:800}
.row{border-left:6px solid var(--c)}
.row .n{background:var(--c);color:var(--cn,#fff)}
.row:nth-child(3n+1){--c:var(--red)}
.row:nth-child(3n+2){--c:var(--blue)}
.row:nth-child(3n){--c:var(--yel);--cn:#14201F}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row{--cn:#10201A}}
:root[data-theme="dark"] .row{--cn:#10201A}
body{background:radial-gradient(900px 420px at 85% -80px,color-mix(in srgb,var(--blue) 22%,transparent),transparent),radial-gradient(700px 380px at -5% 30%,color-mix(in srgb,var(--red) 14%,transparent),transparent),var(--bg)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:4px 0 22px;padding:22px 24px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.hero h1{margin:0 0 6px}.hero .sub{margin:0;max-width:46ch}
.escudo{flex:none;height:140px;width:auto;display:block}
@media(max-width:560px){.escudo{height:84px}.hero{padding:16px}}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.three{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:99px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bad[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;text-decoration:line-through}
.sw{width:34px;height:34px;border-radius:6px;border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.pick{display:flex;gap:8px;align-items:center}
.pick input[type=color]{width:52px;height:42px;padding:2px;flex:none;cursor:pointer}
.pick #hex{font-family:ui-monospace,Menlo,monospace;text-transform:uppercase;max-width:130px}
.pick .btn{padding:9px 14px}
.vacio{color:var(--mute);font-size:13px}
.col{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--chip);border-radius:99px;padding:3px 6px 3px 4px;font-size:13px}
.col i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:block}
.col code{font-family:ui-monospace,Menlo,monospace}
.col button{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px;line-height:1;padding:0 4px}
.out .box{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--blue);border-radius:10px;padding:16px}
#res{white-space:pre-wrap;margin:0 0 14px;font-size:14.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:10px 16px;font:600 14px Archivo,system-ui,sans-serif;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.alt{background:var(--chip);color:var(--ink)}
.cnt{color:var(--mute);font-size:13px;margin-top:10px}
</style>
</head>

<label for="t4">Otra línea (opcional)</label><input id="t4"></div>

<div class="row"><h2><span class="n">6</span>Tipografía y paleta</h2>
<label for="tipo">Tipografía</label><select id="tipo"></select>
<label>Paleta (elige colores rápidos)</label><div class="chips" id="paleta"></div>
<label>Color a medida</label>
<div class="pick"><input type="color" id="rueda" value="#E5392B" aria-label="Rueda de color"><input id="hex" value="#E5392B" maxlength="7" spellcheck="false" aria-label="Código HEX"><button type="button" class="btn alt" id="addc">Añadir</button></div>
<label>Colores elegidos</label><div class="chips" id="elegidos"><span class="vacio">Ninguno todavía</span></div></div>

<div class="row"><h2><span class="n">7</span>Evita</h2>
<div class="chips" id="evita"></div>
<label for="evx">Añadir más cosas a evitar (separadas por comas)</label>
<input id="evx" placeholder="neones, texturas de papel, sombras duras"></div>

</div>
<div class="out"><div class="box">
<pre id="res"></pre>
<div class="btns"><button class="btn" id="copiar">Copiar prompt</button><button class="btn alt" id="reset">Borrar todo</button></div>
<div class="cnt" id="cnt"></div></div></div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const FORMATOS=["9:16","2:3","3:4","4:5","A4","1:1","5:4","4:3","3:2","16:9","21:9"];
const QUE=["cartel","cartel de concierto","entrada","anuncio","objetivo","fiesta","mercado","deporte","cine"];
const DATOS=["fecha","hora","lugar","público","precio","temporada","web","contacto"];
const ESTILOS=["acuarela","minimal","retro","geométrico","risografía","editorial","3D","pop","foto","Swiss","Bauhaus","Constructivismo","Surrealismo","Pop art","Op art","Grabado","Cianotipia","Pixel art"];
const TIPOS=["sans ligera","sans negrita","sans extranegrita","serif clásica","serif editorial","display condensada","manuscrita","monoespaciada"];
const PAL=[["azul noche","#14193A"],["violeta","#5B3FB5"],["turquesa","#12A5B8"],["verde bosque","#1F6B58"],["mostaza","#D9A93A"],["terracota","#B8553A"],["rosa","#C94C6A"],["gris claro","#B5B9C2"]];
const EVITA=["pincel","destellos","flores","rayos","farolillos","banderines","luna","confeti","grupos de personas"];
const ev=new Set(["pincel","destellos","flores","rayos","farolillos","banderines","luna","confeti","grupos de personas"]);
function fill(id,arr,ph){const s=$(id);if(ph)s.add(new Option(ph,""));arr.forEach(v=>s.add(new Option(v,v)))}
fill("formato",FORMATOS);$("formato").value="4:5";
fill("que",QUE);
fill("tipo",TIPOS,"Sin especificar");
DATOS.forEach(d=>{const w=document.createElement("div");w.innerHTML=`<label for="d_${d}">${d}</label><input id="d_${d}">`;$("datos").appendChild(w)});
for(let i=0;i<3;i++){const s=document.createElement("select");s.className="est";s.add(new Option(i?"Estilo "+(i+1)+" (opcional)":"Estilo 1",""));ESTILOS.forEach(v=>s.add(new Option(v,v)));$("estilos").appendChild(s)}
function chip(c,txt,set,cls){const b=document.createElement("button");b.type="button";b.className="chip "+(cls||"");b.textContent=txt;b.setAttribute("aria-pressed",set.has(txt));b.onclick=()=>{set.has(txt)?set.delete(txt):set.add(txt);b.setAttribute("aria-pressed",set.has(txt));build()};$(c).appendChild(b)}
let cols=[];
function pintaCols(){
const c=$("elegidos");c.innerHTML="";
if(!cols.length){c.innerHTML='<span class="vacio">Ninguno todavía</span>'}
cols.forEach((o,i)=>{const s=document.createElement("span");s.className="col";
s.innerHTML=`<i style="background:${o.h}"></i><span>${o.n?o.n+" ":""}<code>${o.h}</code></span>`;
const x=document.createElement("button");x.type="button";x.textContent="×";x.setAttribute("aria-label","Quitar "+o.h);
x.onclick=()=>{cols.splice(i,1);pintaCols();build()};s.appendChild(x);c.appendChild(s)});
document.querySelectorAll(".sw").forEach(b=>b.setAttribute("aria-pressed",cols.some(o=>o.n===b.title)))}
function addCol(h,n){h=h.toUpperCase();if(cols.some(o=>o.h===h))return;cols.push({h,n:n||""});pintaCols();build()}
PAL.forEach(([n,h])=>{const b=document.createElement("button");b.type="button";b.className="sw";b.style.background=h;b.title=n;b.setAttribute("aria-label",n+" "+h);b.setAttribute("aria-pressed","false");
b.onclick=()=>{const i=cols.findIndex(o=>o.n===n);if(i>=0){cols.splice(i,1);pintaCols();build()}else addCol(h,n)};$("paleta").appendChild(b)});
$("rueda").oninput=e=>{$("hex").value=e.target.value.toUpperCase()};
$("hex").oninput=e=>{let v=e.target.value.trim();if(v&&v[0]!=="#")v="#"+v;if(/^#[0-9a-fA-F]{6}$/.test(v)){$("rueda").value=v.toLowerCase();e.target.style.outline=""}else e.target.style.outline="2px solid var(--red)"};
$("addc").onclick=()=>{let v=$("hex").value.trim();if(v&&v[0]!=="#")v="#"+v;if(/^#[0-9a-fA-F]{6}$/.test(v))addCol(v)};
EVITA.forEach(e=>chip("evita",e,ev,"bad"));
function build(){
const L=[];
L.push(`Formato: ${$("formato").value}.`);
L.push(`Es un ${$("que").value}.`);
const dt=DATOS.map(d=>$("d_"+d).value.trim()?`${d}: ${$("d_"+d).value.trim()}`:"").filter(Boolean);
const tema=[$("tema").value.trim(),...dt].filter(Boolean).join(". ");
if(tema)L.push(`Tema: ${tema}.`);
const es=[...document.querySelectorAll(".est")].map(s=>s.value).filter(Boolean);
if(es.length)L.push(`Estilo: ${es.join(", ")}.`);
const tx=["t1","t2","t3","t4"].map(i=>$(i).value.trim()).filter(Boolean).map(t=>`"${t}"`);
if(tx.length)L.push(`Texto exacto: ${tx.join(", ")} y ningún otro texto.`);
const tp=[];if($("tipo").value)tp.push("tipografía "+$("tipo").value);
if(cols.length)tp.push("paleta "+cols.map(o=>o.n?`${o.n} ${o.h}`:o.h).join(", "));
if(tp.length)L.push(`Tipografía y paleta: ${tp.join("; ")}.`);
const evl=[...EVITA.filter(e=>ev.has(e)),...$("evx").value.split(",").map(s=>s.trim()).filter(Boolean)];
if(evl.length)L.push(`Evita: ${evl.join(", ")}.`);
$("res").textContent=L.join("\n");
$("cnt").textContent=L.length+" líneas · "+$("res").textContent.length+" caracteres";
}
document.addEventListener("input",build);
$("copiar").onclick=async()=>{const t=$("res").textContent;try{await navigator.clipboard.writeText(t)}catch(e){const r=document.createRange();r.selectNodeContents($("res"));const s=getSelection();s.removeAllRanges();s.addRange(r);document.execCommand("copy")}
$("copiar").textContent="Copiado";setTimeout(()=>$("copiar").textContent="Copiar prompt",1500)};
$("reset").onclick=()=>{document.querySelectorAll("input,textarea").forEach(i=>i.value="");document.querySelectorAll(".est,#tipo").forEach(s=>s.value="");$("formato").value="4:5";$("que").selectedIndex=0;EVITA.forEach(e=>ev.add(e));cols=[];$("hex").value="#E5392B";$("rueda").value="#e5392b";document.querySelectorAll(".bad").forEach(b=>b.setAttribute("aria-pressed","true"));pintaCols();build()};
build();
</script>
</body>
</html>
